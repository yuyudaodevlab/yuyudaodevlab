name: Refresh profile café note

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "assets/header.svg"
      - "assets/footer.svg"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/profile-daily.yml"

permissions:
  contents: write

concurrency:
  group: profile-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run generator checks
        run: python -m unittest discover -s tests -v
      - name: Refresh daily snapshot
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/daily.svg
          if git diff --cached --quiet; then
            echo "Daily snapshot has no changes."
            exit 0
          fi
          git commit -m "chore: refresh daily profile snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
